name: Daily sentiment update

on:
  schedule:
    - cron: "45 4 * * 1-5"   # ~10:15 AM IST, weekdays — after Cowork's 9:00 AM run
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python scripts/fetch_and_process.py
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

      - name: Commit updated data
        run: |
          git config user.name "gati-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Data update: $(date +'%Y-%m-%d')"
          git push
